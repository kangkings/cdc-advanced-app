server:
  port: 8081
spring:
  application:
    name: data-transformer
  profiles:
    active: local

cdc:
  kafka:
    input-topic: ${CDC_KAFKA_INPUT_TOPIC:cdc-log-entries}
    output-topic: ${CDC_KAFKA_OUTPUT_TOPIC:cdc-transform-events}
    dlq-topic: ${CDC_KAFKA_DLQ_TOPIC:cdc-transformer-dlq}
  source:
    tables:
      - owner: DATA_GENERATOR
        table-name: P_USERS
        key-column: ID
        insert-columns:
          - NAME
          - EMAIL
          - STATUS
          - CREATED_AT
          - UPDATED_AT

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
