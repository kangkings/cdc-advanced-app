server:
  port: 8082
spring:
  application:
    name: data-loader
  profiles:
    active: local

cdc:
  kafka:
    input-topic: ${CDC_KAFKA_INPUT_TOPIC:cdc-transform-events}
    dlq-topic: ${CDC_KAFKA_DLQ_TOPIC:cdc-loader-dlq}
  loader:
    tables:
      - source-table: P_USERS
        target-table: p_users
        key-column: ID
        required-insert-columns:
          - NAME
          - EMAIL
          - STATUS
          - CREATED_AT
          - UPDATED_AT

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
