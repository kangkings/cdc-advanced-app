spring:
  # 애플리케이션 식별과 기본 실행 profile 설정
  application:
    name: log-scanner
  profiles:
    active: local

  # 스케줄러가 Job을 실행하므로 부팅 시 자동 실행 비활성화
  batch:
    job:
      enabled: false

# LogMiner Batch 실행 옵션
batch:
  redo-log-print:
    enabled: ${REDO_LOG_PRINT_BATCH_ENABLED:true}
    max-rows: ${REDO_LOG_PRINT_BATCH_MAX_ROWS:300}

# LogMiner 세션 시작과 조회 대상 테이블 설정
logminer:
  starter:
    enabled: ${LOGMINER_STARTER_ENABLED:false}
  committed-data-only: ${LOGMINER_COMMITTED_DATA_ONLY:true}
  max-scan-scn-range: ${LOGMINER_MAX_SCAN_SCN_RANGE:0}
  # current_scn 직전 안정 구간까지만 스캔하기 위한 SCN 여유폭
  end-scn-safety-margin: ${LOGMINER_END_SCN_SAFETY_MARGIN:0}
  transaction-diagnostics:
    enabled: ${LOGMINER_TRANSACTION_DIAGNOSTICS_ENABLED:false}
    max-logs: ${LOGMINER_TRANSACTION_DIAGNOSTICS_MAX_LOGS:20}
    publish-enabled: ${LOGMINER_TRANSACTION_DIAGNOSTICS_PUBLISH_ENABLED:false}
    log-all-controls: ${LOGMINER_TRANSACTION_DIAGNOSTICS_LOG_ALL_CONTROLS:false}
  targets:
    - P_USERS
    - P_POST

# redo log entry 발행 topic 설정
cdc:
  kafka:
    topic: ${CDC_KAFKA_TOPIC:cdc-log-entries}
  # 연관 테이블을 같은 Kafka partition으로 보내기 위한 aggregate routing rule
  routing:
    tables:
      - table-name: P_USERS
        aggregate-name: USER
        aggregate-key-column: ID
      - table-name: P_POST
        aggregate-name: USER
        aggregate-key-column: USER_ID

# Actuator와 Prometheus 수집 endpoint 노출 설정
management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
